<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>フレンダ鳴き声判定</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main{max-width:560px;margin:auto;padding:18px 14px 50px}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 8px 30px #00000010}
h1{font-size:25px;text-align:center;margin:4px 0}.sub{text-align:center;color:#666;font-size:13px;margin:8px 0 20px}
.orb{width:110px;height:110px;border-radius:55px;background:#f0f0f2;display:grid;place-items:center;font-size:48px;margin:10px auto 18px}
button{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;margin:6px 0}
#start{background:#111;color:#fff}#stop{background:#e8e8ed}button:disabled{opacity:.4}
.status{text-align:center;color:#666;min-height:24px;margin:14px 0}
.result{margin-top:18px}.winner{text-align:center;background:#f7f7f9;border-radius:18px;padding:18px;margin-bottom:10px}
.winner .name{font-size:28px;font-weight:800}.winner .score{font-size:17px;margin-top:4px}
.row{padding:12px 4px;border-bottom:1px solid #eee}.small{font-size:12px;color:#777;line-height:1.55;margin-top:18px}
.hidden{display:none}.ready{font-size:12px;text-align:center;color:#777;margin-bottom:8px}
</style>
</head>
<body>
<main><div class="card">
<h1>🎙️ フレンダ鳴き声判定</h1>
<div class="sub">13匹専用・音源非公開版</div>
<div class="orb">🎧</div>
<div class="ready" id="ready">特徴データを準備中…</div>
<button id="start" disabled>判定スタート</button>
<button id="stop" disabled>停止して判定</button>
<div class="sub" style="margin:14px 0 5px">または音声ファイルでテスト</div>
<input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav" style="width:100%;margin:8px 0 12px" disabled>
<div class="status" id="status">準備しています</div>
<div id="recordingDownload" class="hidden" style="margin:12px 0;padding:14px;background:#eef5ff;border-radius:14px;text-align:center"><div style="font-weight:700;margin-bottom:8px">録音音声の確認・保存</div><audio id="recordingPlayback" controls style="width:100%"></audio><a id="downloadRecording" download="frienda-microphone-recording.m4a" style="display:block;margin-top:10px;padding:12px;background:#1659c7;color:white;border-radius:12px;text-decoration:none;font-weight:700">録音した音声を保存</a><p class="small" style="margin:8px 0 0">iPhoneでは「保存」を押して共有メニューから「ファイルに保存」を選べます。</p></div>
<div id="result" class="result hidden"></div>
<p class="small">13匹の基準特徴と録音・選択した鳴き声を比較します。音量補正と区間ごとの照合を行います。判定方法は試験版で、閾値は未校正です。比較距離は確率や一致率ではなく、小さいほど基準音に近い値です。必ず正解するわけではありません。ゲームセンターでは端末をスピーカーに近づけ、鳴き声の前後の雑音をなるべく減らしてください。</p>
</div></main>
<script>
let ctx,refs=[],stream,processor,source,silentGain,recorded=[],recording=false,recordingStarted=0;
const start=document.getElementById('start');
const stop=document.getElementById('stop');
const ready=document.getElementById('ready');
const status=document.getElementById('status');
const result=document.getElementById('result');
const audioFile=document.getElementById('audioFile');
const recordingDownload=document.getElementById('recordingDownload');
const recordingPlayback=document.getElementById('recordingPlayback');
const downloadRecording=document.getElementById('downloadRecording');
let recordingUrl=null;

function resample(x,srcRate,target=8000){
  if(Math.abs(srcRate-target)<1)return x;
  let n=Math.floor(x.length*target/srcRate),o=new Float32Array(n),r=srcRate/target;
  for(let i=0;i<n;i++){let p=i*r,j=Math.floor(p),f=p-j;o[i]=(x[j]||0)*(1-f)+(x[j+1]||0)*f}
  return o;
}
function trim(x){
  // 20msごとの音量を使って、瞬間的な雑音ではなく音のまとまりを探す
  const block=160, count=Math.ceil(x.length/block);
  const levels=new Float32Array(count);
  let peak=0;
  for(let k=0;k<count;k++){
    let sum=0,n=0;
    for(let i=k*block;i<Math.min(x.length,(k+1)*block);i++){sum+=x[i]*x[i];n++}
    levels[k]=Math.sqrt(sum/Math.max(1,n));
    peak=Math.max(peak,levels[k]);
  }
  if(peak<0.003)return new Float32Array(0);
  const threshold=Math.max(0.003,peak*0.12);
  let a=0,b=count-1;
  while(a<count&&levels[a]<threshold)a++;
  while(b>=a&&levels[b]<threshold)b--;
  if(a>b)return new Float32Array(0);
  return x.slice(Math.max(0,a*block-800),Math.min(x.length,(b+1)*block+800));
}
function fingerprint(x){
  x=trim(x);
  const sr=8000,N=256,hop=128,bands=24,frames=[];
  const freqs=[];
  for(let b=0;b<bands;b++)freqs.push(120*Math.pow(3600/120,b/(bands-1)));
  for(let s=0;s+N<=x.length;s+=hop){
    let vec=[];
    for(const f of freqs){
      let k=Math.round(.5+N*f/sr),w=2*Math.PI*k/N,coeff=2*Math.cos(w),q0=0,q1=0,q2=0;
      for(let i=0;i<N;i++){
        let win=.5-.5*Math.cos(2*Math.PI*i/(N-1));
        q0=coeff*q1-q2+x[s+i]*win;q2=q1;q1=q0;
      }
      let pow=q1*q1+q2*q2-coeff*q1*q2;
      vec.push(Math.log1p(Math.max(0,pow)));
    }
    let mean=vec.reduce((a,b)=>a+b,0)/bands;
    let norm=Math.sqrt(vec.reduce((a,v)=>a+(v-mean)*(v-mean),0))+1e-6;
    frames.push(vec.map(v=>(v-mean)/norm));
  }
  return frames;
}
function cos(a,b){
  let d=0,aa=0,bb=0;
  for(let i=0;i<a.length;i++){d+=a[i]*b[i];aa+=a[i]*a[i];bb+=b[i]*b[i]}
  return d/(Math.sqrt(aa*bb)+1e-6);
}
function dtw(A,B){
  if(!A.length||!B.length)return Infinity;
  const n=A.length,m=B.length;
  let prev=new Float64Array(m+1).fill(Infinity),prevSteps=new Uint32Array(m+1);
  prev[0]=0;
  for(let i=1;i<=n;i++){
    const cur=new Float64Array(m+1).fill(Infinity),steps=new Uint32Array(m+1);
    for(let j=1;j<=m;j++){
      const cost=1-cos(A[i-1],B[j-1]);
      let best=prev[j-1],count=prevSteps[j-1];
      if(prev[j]<best){best=prev[j];count=prevSteps[j]}
      if(cur[j-1]<best){best=cur[j-1];count=steps[j-1]}
      cur[j]=best+cost;steps[j]=count+1;
    }
    prev=cur;prevSteps=steps;
  }
  // 経路のステップ数で割り、長い基準音が有利になる偏りを軽減
  const average=prev[m]/Math.max(1,prevSteps[m]);
  // 極端に長さが違う基準音への弱いペナルティ（暫定値）
  return average+0.06*Math.abs(Math.log(n/m));
}
async function loadRefs(){
  try{
    const response=await fetch('./references.json',{cache:'no-store'});
    if(!response.ok)throw new Error('references.json HTTP '+response.status);
    const data=await response.json();
    if(!Array.isArray(data)||!data.length||data.some(r=>!r.name||!Array.isArray(r.fp)||!r.fp.length)){
      throw new Error('特徴データの形式が不正です');
    }
    refs=data;
    ready.textContent='✓ '+refs.length+'匹分の特徴データを読み込みました';
    status.textContent='「判定スタート」を押してください';
    start.disabled=false;
    audioFile.disabled=false;
  }catch(e){
    ready.textContent='特徴データの読み込みに失敗しました';
    status.textContent='エラー: '+e.message;
    start.disabled=true;
  }
}
let mediaRecorder=null,recordedBlobs=[];
async function begin(){
  if(recording||!refs.length)return;
  start.disabled=true;audioFile.disabled=true;
  try{
    if(!window.MediaRecorder)throw new Error('このブラウザはMediaRecorderに対応していません');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    recordedBlobs=[];
    recordingDownload.classList.add('hidden');
    const types=['audio/mp4','audio/webm;codecs=opus','audio/webm'];
    const type=types.find(t=>MediaRecorder.isTypeSupported(t));
    mediaRecorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);
    mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)recordedBlobs.push(e.data)};
    mediaRecorder.onerror=e=>{status.textContent='録音エラー: '+(e.error?.message||'不明なエラー')};
    mediaRecorder.onstop=async()=>{
      try{
        const blob=new Blob(recordedBlobs,{type:mediaRecorder.mimeType||'audio/mp4'});
        if(blob.size<100){throw new Error('音声データが保存されませんでした')}
        if(recordingUrl)URL.revokeObjectURL(recordingUrl);
        recordingUrl=URL.createObjectURL(blob);
        recordingPlayback.src=recordingUrl;
        downloadRecording.href=recordingUrl;
        const extension=blob.type.includes('webm')?'webm':blob.type.includes('ogg')?'ogg':'m4a';
        downloadRecording.download='frienda-microphone-recording.'+extension;
        recordingDownload.classList.remove('hidden');
        status.textContent='録音を解析しています…';
        if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
        if(ctx.state==='suspended')await ctx.resume();
        const buffer=await ctx.decodeAudioData(await blob.arrayBuffer());
        const samples=new Float32Array(buffer.length);
        for(let ch=0;ch<buffer.numberOfChannels;ch++){
          const channel=buffer.getChannelData(ch);
          for(let i=0;i<samples.length;i++)samples[i]+=channel[i]/buffer.numberOfChannels;
        }
        if(buffer.duration<0.15)throw new Error('録音が短すぎます（'+buffer.duration.toFixed(2)+'秒）');
        compareSamples(samples,buffer.sampleRate);
      }catch(e){status.textContent='録音解析エラー: '+e.message;start.disabled=false;audioFile.disabled=false}
      finally{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}mediaRecorder=null}
    };
    mediaRecorder.start(250);
    recording=true;recordingStarted=performance.now();
    stop.disabled=false;result.classList.add('hidden');
    status.textContent='🔴 録音中… 鳴き声が終わったら停止してください';
  }catch(e){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    recording=false;start.disabled=false;stop.disabled=true;audioFile.disabled=false;
    status.textContent='マイクを使用できません: '+e.message;
  }
}
function detectSegments(x){
  const block=800, n=Math.ceil(x.length/block), levels=[];
  for(let k=0;k<n;k++){
    let sum=0,count=0;
    for(let i=k*block;i<Math.min(x.length,(k+1)*block);i++){
      sum+=x[i]*x[i];count++;
    }
    levels.push(Math.sqrt(sum/Math.max(1,count)));
  }
  const peak=Math.max(0,...levels);
  if(peak<0.00008)return [];
  const threshold=Math.max(peak*0.16,0.00006);
  const active=levels.map(v=>v>=threshold);
  // 0.2秒以下の小さな隙間をつなぐ
  for(let i=1;i<active.length-2;i++){
    if(active[i-1]&&active[i+2]){active[i]=true;active[i+1]=true}
  }
  const segments=[];let start=-1;
  for(let i=0;i<=n;i++){
    if(i<n&&active[i]&&start<0)start=i;
    if(start>=0&&(i===n||!active[i])){
      const from=Math.max(0,start*block-1200);
      const to=Math.min(x.length,i*block+1200);
      if(to-from>=0.32*8000)segments.push([from,to]);
      start=-1;
    }
  }
  return segments;
}
function normalizeAudio(x){
  let peak=0;
  for(const v of x)peak=Math.max(peak,Math.abs(v));
  if(peak<0.00005)return x;
  const gain=Math.min(120,0.75/peak);
  const out=new Float32Array(x.length);
  for(let i=0;i<x.length;i++)out[i]=x[i]*gain;
  return out;
}
function compareSamples(all,sampleRate){
  start.disabled=true;audioFile.disabled=true;
  status.textContent='音声の区間を検出しています…';
  setTimeout(()=>{
    try{
      const x=normalizeAudio(resample(all,sampleRate));
      const ranges=detectSegments(x);
      const windows=[];
      if(x.length<=3.0*8000)windows.push([0,x.length]);
      for(const [a,b] of ranges){
        const duration=(b-a)/8000;
        if(duration<=3.0){windows.push([a,b]);continue}
        // 長い区間は重複する短い窓で検査
        for(const seconds of [1.2,1.8,2.4]){
          const size=Math.round(seconds*8000),step=Math.round(0.45*8000);
          for(let pos=a;pos+size<=b;pos+=step)windows.push([pos,pos+size]);
        }
      }
      if(!windows.length)throw new Error('鳴き声に相当する区間が見つかりませんでした');
      const candidates=windows.slice(0,65);
      const best=new Map();
      for(const [a,b] of candidates){
        const fp=fingerprint(x.slice(a,b));
        if(fp.length<8)continue;
        for(const r of refs){
          const d=dtw(fp,r.fp);
          const old=best.get(r.name);
          if(!old||d<old.d)best.set(r.name,{name:r.name,d,from:a/8000,to:b/8000});
        }
      }
      const scores=[...best.values()].sort((a,b)=>a.d-b.d);
      if(!scores.length)throw new Error('比較できる音声がありません');
      draw(scores.slice(0,3));
      status.textContent='判定完了（'+candidates.length+'区間を比較）';
    }catch(e){status.textContent='判定エラー: '+e.message}
    finally{start.disabled=false;audioFile.disabled=false}
  },50);
}
function finish(){
  if(!recording||!mediaRecorder)return;
  recording=false;stop.disabled=true;
  status.textContent='録音を終了しています…';
  try{
    if(mediaRecorder.state!=='inactive')mediaRecorder.stop();
  }catch(e){status.textContent='停止エラー: '+e.message;start.disabled=false;audioFile.disabled=false}
}
audioFile.onchange=async()=>{
  const file=audioFile.files&&audioFile.files[0];
  if(!file||!refs.length||recording)return;
  start.disabled=true;audioFile.disabled=true;
  result.classList.add('hidden');
  status.textContent='ファイルを解析しています…';
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    const data=await file.arrayBuffer();
    const buffer=await ctx.decodeAudioData(data);
    const samples=new Float32Array(buffer.length);
    for(let ch=0;ch<buffer.numberOfChannels;ch++){
      const channel=buffer.getChannelData(ch);
      for(let i=0;i<samples.length;i++)samples[i]+=channel[i]/buffer.numberOfChannels;
    }
    compareSamples(samples,buffer.sampleRate);
  }catch(e){
    status.textContent='ファイルを読み込めません: '+e.message;
    start.disabled=false;audioFile.disabled=false;
  }
};
function draw(s){
  result.classList.remove('hidden');
  if(!s.length||!Number.isFinite(s[0].d)){
    result.textContent='判定できませんでした。もう一度録音してください。';return;
  }
  const gap=s.length>1?s[1].d-s[0].d:0;
  const uncertain=gap<0.035 || s[0].d>0.65;
  result.innerHTML=`<div class="winner"><div>最も近い鳴き声（暫定）</div><div class="name">${s[0].name}</div><div class="score">比較距離 ${s[0].d.toFixed(4)}</div><div class="small">検出区間 ${s[0].from.toFixed(2)}〜${s[0].to.toFixed(2)}秒</div><div class="small">${uncertain?'判定が不確かです。音声を確認するか再録音してください。':'最も近い基準音です。正解を保証するものではありません。'}</div></div>`+
    s.map((x,i)=>`<div class="row"><b>${i+1}位 ${x.name}</b>　比較距離 ${x.d.toFixed(4)}</div>`).join('');
}
start.onclick=begin;
stop.onclick=finish;
loadRefs();
</script>
</body>
</html>
